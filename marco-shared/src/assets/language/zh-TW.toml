about_app_name = "Marco"
about_tagline = "寫得更快，想得更清晰。"
about_version = "版本 {version}"
about_description = "一款使用 Rust 構建、支持即時預覽的快速原生 Markdown 編輯器。\n\n完全兼容 CommonMark，并通過自主開發的解析器實現精細控制。借助 GTK4 提供原生性能，跨平臺支持 Linux 和 Windows，并可在輸入時即時同步預覽。\n\n支持 GFM 表格、工作清單、腳注、標題 ID、自動連結、刪除線、自訂行內元素等功能。\n\n使用 Rust、GTK4、WebKit6/WebView2、SourceView5、nom 解析器和 Cairo 構建。"
