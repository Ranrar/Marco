[workspace]
resolver = "3"
members = ["marco", "polo", "marco-shared"]

# `marco-core` is its own published crate (https://crates.io/crates/marco-core)
# and lives in its own repository. Pull it from crates.io with a single shared
# version so all workspace members stay in sync.
[workspace.dependencies.marco-core]
version = "1.3.3"

# Shared workspace dependencies
[workspace.dependencies]
# Serialization
ron = "0.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1"
log = "0.4.29"
chrono = { version = "0.4.43", features = ["serde"] }
tempfile = "3.25.0"
emojis = "0.8.0"
fontconfig = "0.10.0"
dirs = "6.0.0"
htmlescape = "0.3.1"                 # HTML entity encoding/decoding
syntect = "5.3.0"                    # Syntax highlighting (used by marco for theme CSS export)
katex-rs = "0.2.3"                   # Pure Rust KaTeX math rendering (used by marco math dialog)

# UI dependencies
gtk4 = { version = "=0.11.4", features = ["v4_12"] }
glib = "0.22.5"
glib-unix = "0.22.0"
gio = "0.22.5"
sourceview5 = "0.11.1"
dark-light = "3.0.0"
# Awaitable channel for handing background-thread events to the GTK main loop.
async-channel = "2.5.0"
librsvg = "2"
cairo-rs = "0.22.0"
gdk-pixbuf = "0.22.0"

# Unified WebView
# Tracks the fork's `gtk4-webkit6` branch (Linux backend is GTK4 + WebKit6;
# Windows is WebView2), pinned to an exact commit for reproducible builds
# because that branch moves. Bump by updating `rev` to the new branch head.
# `protocol` is gone as of 0.56 — custom protocols are always available now, so
# the feature no longer exists. `os-webview` still pulls in webkit6/gtk4/soup3.
wry = { git = "https://github.com/Ranrar/wry", rev = "6328003336cb1b93bde710f73a4572c01f509f2d", default-features = false, features = ["os-webview"] }
# Direct webkit6 dep (Linux): raw WebKit APIs not exposed through wry —
# `PrintOperation` (print/PDF) and `load_html(html, base_uri)`.
webkit6 = "0.6.1"
gdk4-win32 = "0.11.0"
raw-window-handle = "0.6.2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }

# Test dependencies
clap = { version = "4.5.58", features = ["derive"] }
serial_test = "3.3.1"

# Profile optimizations
[profile.dev]
opt-level = 0           # No optimization for fastest compilation
debug = true            # Full debug info
incremental = true      # Enable incremental compilation
overflow-checks = true  # Safety checks in dev
split-debuginfo = 'unpacked'  # Faster linking on Windows/macOS

[profile.release]
opt-level = 3           # Maximum optimization
debug = false           # No debug symbols
lto = "thin"            # Thin LTO - faster than "fat" LTO with good optimization
codegen-units = 16      # Parallel codegen - much faster than 1
strip = true            # Strip symbols to reduce binary size
panic = 'abort'         # Smaller binaries, no unwinding
