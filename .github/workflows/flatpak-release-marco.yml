# Build Marco's Flatpak, on demand.
#
# MANUAL ONLY. There is no push or tag trigger, on purpose: releases are cut by
# hand. This workflow builds and verifies, it does not tag and does not create a
# release. Polo has its own copy of this file, release-polo.yml; neither builds
# the other.
#
# Two things it can build, chosen by the `manifest` input:
#
#   local    build/linux/flatpak/marco/io.github.ranrar.Marco.yml
#            Builds the checked-out tree (a `dir` source, network allowed at
#            build time). Use this to get a .flatpak bundle out of a branch.
#
#   flathub  build/linux/flatpak/marco/io.github.ranrar.Marco.flathub.yml
#            Builds the tagged commit named in that manifest, offline, against
#            the vendored cargo-sources.json -- the same thing Flathub's builder
#            will do. Use this as the pre-submission gate. It fails unless the
#            manifest's `tag` and `commit` are real.
#
# The linters run either way. `finish-args-home-filesystem-access` is expected
# and tolerated -- it is the permission the Flathub exception request covers,
# see build/linux/flatpak/README.md section 4. Any other finding fails the run.

name: Release Marco (Flatpak)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (tag, branch or sha). Empty = the ref this run was started from."
        required: false
        default: ""
      manifest:
        description: "Which manifest to build"
        type: choice
        options:
          - local
          - flathub
        default: local
      attach_to_release:
        description: "Upload the bundle to an existing GitHub release"
        type: boolean
        default: false
      release_tag:
        description: "Release tag to upload to (required when attaching)"
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  APP_ID: io.github.ranrar.Marco
  APP_DIR: build/linux/flatpak/marco
  VERSION_KEY: marco
  BUNDLE_PREFIX: marco

concurrency:
  group: release-marco
  cancel-in-progress: false

jobs:
  flatpak:
    name: Build and verify the Marco Flatpak
    runs-on: ubuntu-24.04
    permissions:
      contents: write # only used by the optional release upload

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install Flatpak and the GNOME 50 runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          # dbus-daemon is for dbus-run-session; see the build step for why a
          # session bus is not optional here.
          sudo apt-get install -y --no-install-recommends flatpak dbus-daemon

          # User installation throughout, matching the local build scripts.
          flatpak remote-add --user --if-not-exists \
            flathub https://dl.flathub.org/repo/flathub.flatpakrepo

          # Versions are pinned deliberately; see build/linux/flatpak/README.md
          # section 2. Moving the runtime means moving it in both manifests too.
          flatpak install --user -y --noninteractive flathub \
            org.flatpak.Builder \
            org.gnome.Platform//50 \
            org.gnome.Sdk//50 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Check cargo-sources.json against Cargo.lock
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, sys

          src = json.load(open("build/linux/flatpak/cargo-sources.json"))
          vendored = {
              e["dest"].removeprefix("cargo/vendor/")
              for e in src
              if e.get("type") == "archive" and e.get("dest", "").startswith("cargo/vendor/")
          }

          lock = open("Cargo.lock").read()
          pkgs = re.findall(
              r'\[\[package\]\]\nname = "([^"]+)"\nversion = "([^"]+)"\n(?:source = "([^"]+)"\n)?',
              lock,
          )
          locked = {f"{n}-{v}" for n, v, s in pkgs if s.startswith("registry+")}

          missing = sorted(locked - vendored)
          stale = sorted(vendored - locked)
          if missing or stale:
              print("cargo-sources.json does not match Cargo.lock.")
              print("  missing (in the lockfile, not vendored):", missing)
              print("  stale (vendored, not in the lockfile):  ", stale)
              print()
              print("Regenerate it -- build/linux/flatpak/README.md section 6 -- and commit.")
              sys.exit(1)

          print(f"cargo-sources.json is in step with Cargo.lock ({len(locked)} crates).")
          PY

      - name: Stage the manifest
        id: stage
        run: |
          set -euo pipefail

          case "${{ inputs.manifest }}" in
            local)
              # Built in place: its `dir` source is relative to the manifest's
              # own directory, so it has to stay where it lives.
              echo "manifest=${APP_DIR}/${APP_ID}.yml" >> "$GITHUB_OUTPUT"
              ;;

            flathub)
              # Staged into the layout Flathub expects: the manifest named after
              # the app ID, with cargo-sources.json beside it rather than one
              # directory up. Building or linting it in place fails on both
              # counts -- the sources include cannot be resolved, and the
              # filename does not match the app ID.
              stage="${RUNNER_TEMP}/flathub"
              mkdir -p "$stage"
              cp "${APP_DIR}/${APP_ID}.flathub.yml"          "${stage}/${APP_ID}.yml"
              cp build/linux/flatpak/cargo-sources.json      "${stage}/"

              # The placeholder sha builds nothing. Catch it here rather than
              # after the runtime download.
              if grep -Eq "^\s*commit:\s*'0{40}'" "${stage}/${APP_ID}.yml"; then
                echo "::error::${APP_ID}.flathub.yml still carries the placeholder commit sha." >&2
                echo "Set 'tag' and 'commit' to the real release before building this manifest." >&2
                exit 1
              fi

              echo "manifest=${stage}/${APP_ID}.yml" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Lint the manifest
        run: |
          set -euo pipefail
          bash .github/scripts/flatpak-lint.sh \
            manifest "${{ steps.stage.outputs.manifest }}"

      - name: Build
        run: |
          set -euo pipefail
          # --filesystem=host: the builder is a sandboxed app and the workspace
          # lives outside the paths it is granted by default.
          #
          # dbus-run-session is REQUIRED, not defensive. flatpak-builder runs
          # inside the org.flatpak.Builder sandbox and proxies every flatpak
          # call back to the host over the org.freedesktop.Flatpak session-bus
          # service. A runner has no session bus, so those calls fail with
          # "Cannot autolaunch D-Bus without X11 $DISPLAY".
          #
          # --disable-rofiles-fuse: rofiles-fuse cannot get a FUSE fd from
          # inside the Builder's own sandbox. It is a build-cache optimisation.
          dbus-run-session -- \
          flatpak run --filesystem=host org.flatpak.Builder \
            --force-clean \
            --disable-rofiles-fuse \
            --user \
            --install-deps-from=flathub \
            --repo="${RUNNER_TEMP}/repo" \
            --state-dir="${RUNNER_TEMP}/state" \
            "${RUNNER_TEMP}/build" \
            "${{ steps.stage.outputs.manifest }}"

      - name: Lint the build directory
        run: |
          set -euo pipefail
          bash .github/scripts/flatpak-lint.sh \
            builddir "${RUNNER_TEMP}/build"

      - name: Bundle
        id: bundle
        run: |
          set -euo pipefail
          version="$(python3 -c \
            'import json;print(json.load(open("build/version.json"))["linux"]["'"${VERSION_KEY}"'"])')"

          # Metainfo drives what software centres display; a bundle whose
          # version has no <release> entry ships a listing that stops at the
          # previous version. The local build scripts warn about this too.
          if ! grep -q "<release version=\"${version}\"" "${APP_DIR}/${APP_ID}.metainfo.xml"; then
            echo "::warning::No <release version=\"${version}\"> in ${APP_ID}.metainfo.xml."
          fi

          bundle="${RUNNER_TEMP}/${BUNDLE_PREFIX}_${version}_linux_amd64.flatpak"

          # --runtime-repo embeds where to fetch org.gnome.Platform//50 from.
          # Without it the bundle only installs on machines that already have
          # the flathub remote configured.
          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            "${RUNNER_TEMP}/repo" "$bundle" "${APP_ID}"

          ls -lh "$bundle"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "path=${bundle}" >> "$GITHUB_OUTPUT"

      - name: Upload bundle as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: marco-flatpak
          path: ${{ steps.bundle.outputs.path }}
          retention-days: 7

      # Opt-in, and it uploads to a release that already exists. Creating the
      # tag and the release stays a manual step.
      - name: Attach the bundle to an existing release
        if: ${{ inputs.attach_to_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ]; then
            echo "::error::attach_to_release is set but release_tag is empty." >&2
            exit 1
          fi
          gh release upload "$tag" "${{ steps.bundle.outputs.path }}" --clobber
